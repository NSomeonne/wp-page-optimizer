name: WPO Test & Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: [8.2]
    name: Test (PHP ${{ matrix.php-version }})
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, intl, gd, curl, dom, fileinfo, json, mysqli, zip
          coverage: xdebug
      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Run PHPUnit
        run: ./vendor/bin/phpunit

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2
          extensions: mbstring, intl, gd, curl, dom, fileinfo, json, mysqli, zip
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Run PHPStan
        run: ./vendor/bin/phpstan analyse wp-page-optimizer.php includes/

  build-zip:
    needs: [test, lint]
    runs-on: ubuntu-latest
    name: Budowanie ZIP
    steps:
      - uses: actions/checkout@v4
      - name: Build plugin ZIP
        run: |
          zip -r wp-page-optimizer.zip . -x '*.git*' '*tests*' '*.github*' '*.env*' 'vendor/*' 'node_modules/*' '*.zip'
      - uses: actions/upload-artifact@v4
        with:
          name: wp-page-optimizer
          path: wp-page-optimizer.zip
